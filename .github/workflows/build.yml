name: Build

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: |
          dotnet test tests/GDSB.Infrastructure.Tests/GDSB.Infrastructure.Tests.csproj -c Release
          dotnet test tests/GDSB.MAUI.Tests/GDSB.MAUI.Tests.csproj -c Release

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MAUI Android workload
        run: dotnet workload restore src/GDSB.MAUI/GDSB.MAUI.csproj -p:GdsbAndroidOnly=true

      - name: Build Android
        run: dotnet build src/GDSB.MAUI/GDSB.MAUI.csproj -c Release -p:GdsbAndroidOnly=true

      - name: Publish Android (valida o R8 e gera o mapping)
        run: dotnet publish src/GDSB.MAUI/GDSB.MAUI.csproj -c Release -f net10.0-android -p:GdsbAndroidOnly=true -p:AndroidKeyStore=false -p:RunAOTCompilation=false

      - name: Conferir mapping.txt e metadados do .aab
        run: |
          set -e
          ls -la artifacts/mapping/
          test -s artifacts/mapping/mapping-*.txt
          AAB=$(find src/GDSB.MAUI/bin/Release/net10.0-android -name '*.aab' | head -1)
          echo "AAB: $AAB"
          unzip -l "$AAB" | grep -i 'proguard' || echo "AVISO: mapping não localizado no BUNDLE-METADATA do .aab"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MAUI workload
        run: dotnet workload restore src/GDSB.MAUI/GDSB.MAUI.csproj

      - name: Build Windows
        run: dotnet build src/GDSB.MAUI/GDSB.MAUI.csproj -c Release -f net10.0-windows10.0.19041.0 -p:WindowsPackageType=None
